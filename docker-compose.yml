version: '3.9'

services:
  # ─────────────────────────────────────────────
  # Backend – Express + Prisma + Socket.IO
  # ─────────────────────────────────────────────
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: helpgrid-server
    restart: unless-stopped
    env_file:
      - ./server/.env.docker
    environment:
      - NODE_ENV=production
      - PORT=5000
    volumes:
      # Persist SQLite database file across container restarts
      - db_data:/app/prisma
      # Persist uploaded files
      - uploads_data:/app/uploads
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - helpgrid_net

  # ─────────────────────────────────────────────
  # Frontend – React (Vite build) served by Nginx
  # ─────────────────────────────────────────────
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: helpgrid-client
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      server:
        condition: service_healthy
    networks:
      - helpgrid_net

# ─────────────────────────────────────────────
# Named volumes for data persistence
# ─────────────────────────────────────────────
volumes:
  db_data:
    driver: local
  uploads_data:
    driver: local

# ─────────────────────────────────────────────
# Internal network
# ─────────────────────────────────────────────
networks:
  helpgrid_net:
    driver: bridge
